<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body { font-family: Arial; background: #1a1a2e; color: white; text-align: center; padding: 40px; }
    h1 { color: #00d4ff; }
    #messages { background: #16213e; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; }
    .msg { padding: 10px; border-bottom: 1px solid #333; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🔌 ESP32 Live Dashboard</h1>
  <p id="status">Connecting...</p>
  <div id="messages"></div>

  <script>
    const client = mqtt.connect("wss://8c77d38bb13146aeb2858d539a7cd2d0.s1.eu.hivemq.cloud:8884/mqtt", {
      username: "radha",
      password: "Radha@mqtt123"
    });

    client.on("connect", () => {
      document.getElementById("status").innerText = "✅ Connected!";
      client.subscribe("test/hello");
    });

    client.on("message", (topic, message) => {
      const div = document.getElementById("messages");
      div.innerHTML = `<div class="msg">📨 ${message.toString()}</div>` + div.innerHTML;
    });
  </script>
</body>
</html>
